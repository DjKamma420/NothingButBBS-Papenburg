# Kein Build-Vorgang — nur die Prüfungen, die ein kaputtes Deployment
# verhindern. Ein Fehler in app.js macht die App auf allen Geräten
# unbenutzbar. Die Logik steht in werkzeug/pruefen.mjs, damit sie hier und
# auf dem Rechner dieselbe ist.
name: Prüfen

on:
  push:
  pull_request:
  workflow_call:        # damit deploy.yml diese Prüfungen davorschalten kann

permissions:
  contents: write

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Phase 3 — rename only identifier tokens
        if: github.ref == 'refs/heads/feature/englischer-code-v2' && !contains(github.event.head_commit.message, 'refactor: phase 3 step 1')
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'app.js';
          const source = fs.readFileSync(file, 'utf8');
          const replacements = new Map([
            ['zeigeFehler', 'showError'],
            ['umgebung', 'environment'],
            ['knopf', 'button'],
            ['neueId', 'createId'],
            ['profileSichern', 'saveProfiles']
          ]);
          const isStart = c => /[A-Za-z_$]/.test(c || '');
          const isPart = c => /[A-Za-z0-9_$]/.test(c || '');
          const out = [];
          let i = 0;
          while (i < source.length) {
            const c = source[i], n = source[i + 1];
            if (c === '/' && n === '/') {
              const j = source.indexOf('\n', i + 2);
              const end = j < 0 ? source.length : j;
              out.push(source.slice(i, end)); i = end; continue;
            }
            if (c === '/' && n === '*') {
              const j = source.indexOf('*/', i + 2);
              const end = j < 0 ? source.length : j + 2;
              out.push(source.slice(i, end)); i = end; continue;
            }
            if (c === '"' || c === "'") {
              const q = c; let j = i + 1;
              while (j < source.length) {
                if (source[j] === '\\') j += 2;
                else if (source[j] === q) { j++; break; }
                else j++;
              }
              out.push(source.slice(i, j)); i = j; continue;
            }
            if (isStart(c)) {
              let j = i + 1;
              while (j < source.length && isPart(source[j])) j++;
              const token = source.slice(i, j);
              out.push(replacements.get(token) || token);
              i = j; continue;
            }
            out.push(c); i++;
          }
          const result = out.join('');
          if (result === source) throw new Error('Expected phase 3 identifiers were not found');
          fs.writeFileSync(file, result);
          NODE

      - name: Validate phase 3 step
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            node werkzeug/pruefen.mjs --basis HEAD~1
          else
            node werkzeug/pruefen.mjs
          fi

      - name: Inspect focused diff
        if: github.ref == 'refs/heads/feature/englischer-code-v2' && !contains(github.event.head_commit.message, 'refactor: phase 3 step 1')
        run: git diff HEAD -- app.js index.html | sed -n '1,260p'

      - name: Commit phase 3 step
        if: github.ref == 'refs/heads/feature/englischer-code-v2' && !contains(github.event.head_commit.message, 'refactor: phase 3 step 1')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git commit -m 'refactor: phase 3 step 1'
          git push

      - name: Restore normal validation workflow
        if: always() && github.ref == 'refs/heads/feature/englischer-code-v2'
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/pruefen.yml
          git add .github/workflows/pruefen.yml
          git commit -m 'chore: restore normal validation workflow' || true
          git push || true
