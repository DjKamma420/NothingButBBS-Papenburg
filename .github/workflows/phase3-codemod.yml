name: Phase 3 identifier codemod
on:
  push:
    paths: ['.github/workflows/phase3-codemod.yml']
permissions:
  contents: write
jobs:
  codemod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename code identifiers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = [Path('app.js'), Path('index.html')]
          mapping = {
            'zeigeFehler':'showError', 'umgebung':'environment', 'knopf':'button',
            'neueId':'newId', 'zustandLaden':'loadState', 'datenMigrieren':'migrateData',
            'merkblattUmziehen':'migrateHandouts', 'ansicht':'view', 'einSub':'entrySub',
            'bearbeiten':'editing', 'gewaehlt':'selectedDate', 'kalMonat':'calendarMonth',
            'kalTag':'calendarDay', 'zwei':'pad2', 'zeigDatum':'formatDate',
            'gleich':'sameDate', 'montagVon':'mondayOf', 'plusTage':'addDays',
            'tagIndex':'dayIndex', 'kalenderwoche':'calendarWeek', 'wocheFuer':'weekFor',
            'minuten':'minutes', 'jetztMin':'currentMinutes', 'normalisiere':'normalize',
            'aufraeumen':'cleanup', 'archiviertAm':'archivedAt', 'archivFrist':'archiveRetention',
            'archivRest':'archiveRemaining', 'archivAufraeumen':'cleanupArchive',
            'sichern':'saveAll', 'insArchiv':'moveToArchive', 'ausArchiv':'restoreFromArchive',
            'aktiv':'activeEntries', 'sonderAktiv':'activeEvents', 'notenAktiv':'activeGrades',
            'sonderAn':'eventAt', 'sonderFrei':'freeEvents', 'sonderTag':'eventsForDay',
            'eintraegeAm':'entriesForDay', 'faecher':'subjects', 'alleFaecher':'allSubjects',
            'lehrerName':'teacherName', 'fachName':'subjectName', 'freiAm':'holidayOn',
            'hatFachAm':'hasSubjectOn', 'naechsterTagMitFach':'nextDayWithSubject',
            'anteilFuer':'weightFor', 'profileSichern':'saveProfiles', 'profileLaden':'loadProfiles',
            'profilSchluessel':'profileKeys', 'profilName':'profileName', 'profilId':'profileId',
            'profilAktiv':'activeProfile', 'cfg':'config',
          }
          for path in files:
            s = path.read_text()
            for old, new in mapping.items():
              s = re.sub(r'(?<![A-Za-z0-9_$])' + re.escape(old) + r'(?![A-Za-z0-9_$])', new, s)
            path.write_text(s)
          PY
      - name: Validate
        run: node werkzeug/pruefen.mjs
      - name: Commit codemod
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: translate phase 3 code identifiers'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm .github/workflows/phase3-codemod.yml || true
          git commit -m 'chore: remove temporary phase 3 codemod' || true
          git push || true
