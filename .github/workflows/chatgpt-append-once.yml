name: one-shot ChatGPT communication append

on:
  push:
    branches: [feature/sprachumschalter]

permissions:
  contents: write

jobs:
  append:
    if: github.event.head_commit.message == 'docs: phase2 handoff'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append ChatGPT result and remove helper
        run: |
          cat >> KOMMUNIKATION.md <<'EOF'

